name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publisher (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # CHANGED: now needs publish-pypi too, not just build. A GitHub Release
  # advertises "this version shipped" to anyone browsing the repo -- it must
  # never go out when the actual PyPI publish failed. This is the exact
  # mechanism that made v1.2.0/v1.2.1 look released while PyPI never got them.
  publish-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog section for this tag
        id: changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          # Extract the section from CHANGELOG.md between this version and the next header
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          # Write to a temp file to avoid quoting issues with multiline strings
          echo "$NOTES" > release_notes.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.txt
          files: dist/*
          fail_on_unmatched_files: false

  # NEW: makes a failed publish impossible to miss. A red X on the Actions
  # tab is easy to walk past -- this opens (or re-uses) a standing GitHub
  # Issue, which shows up in the repo's issue count and emails watchers,
  # the same way v1.2.0 and v1.2.1's silent failures should have but didn't.
  notify-on-failure:
    name: Alert on release failure
    runs-on: ubuntu-latest
    needs: [build, publish-pypi, publish-github-release]
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Release pipeline failed for ${tag}`;
            const body = [
              `The Release workflow failed for tag \`${tag}\`.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `This means the package may NOT be on PyPI even if a GitHub Release exists. Verify at https://pypi.org/project/zugashield/#history before telling anyone this version shipped.`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'release-failure',
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['release-failure'],
              });
            }

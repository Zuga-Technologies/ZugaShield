name: CI

# This repo's default branch is master. Until 2026-09-27 these triggers said
# main, so CI never ran on a single push or PR.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (Python 3.12)
    runs-on: ubuntu-latest
    # Report-only until the backlog from the never-run years is cleared: the
    # first local run found 798 ruff findings, 53 files needing ruff format,
    # and mypy stopping on numpy's stubs. Remove this line once lint is green,
    # or it becomes a check nobody reads.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check zugashield/ zugashield_mcp/ tests/
      - name: ruff format check
        run: ruff format --check zugashield/ zugashield_mcp/ tests/
      - name: mypy type check
        run: mypy zugashield/ --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,all]"
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Verify import
        run: python -c "from zugashield import ZugaShield; print(f'ZugaShield OK - Python {__import__(\"sys\").version}')"

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
